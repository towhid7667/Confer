        if (window.__resumeSessionBridge__) window.__resumeSessionBridge__(s.id);
      });
      body.appendChild(row);
    });
  });
};

/* ── Onboarding checklist ─────────────── */
const ONBOARDING_ITEMS = [
  { text: 'Chat with Claude using the prompt box below.', show: function() { closeOverlay(); $prompt.focus(); } },
  { text: 'Reference files with @-mentions — type @ to search.', show: function() { closeOverlay(); $prompt.value = '@'; $prompt.dispatchEvent(new Event('input')); $prompt.focus(); } },
  { text: 'Highlight code in the editor and press Shift+Alt+C to bring it into the chat.', show: null },
  { text: 'Review edits Claude makes — Keep or Revert them from the tool card.', show: null },
];

function showOnboardingOverlay() {
  const body = openOverlay('Learn Confer');
  body.innerHTML = '';
  ONBOARDING_ITEMS.forEach(function(item) {
    const row = document.createElement('div');
    row.className = 'ob-item';
    row.innerHTML = '<div class="ob-item-text">' + esc(item.text) + '</div>';
    if (item.show) {
      const btn = document.createElement('button');
      btn.className = 'ob-show-btn';
      btn.type = 'button';
      btn.textContent = 'Show me';
      btn.addEventListener('click', item.show);
      row.appendChild(btn);
    }
    body.appendChild(row);
  });
  const dismissBtn = document.createElement('button');
  dismissBtn.className = 'ob-dismiss-btn';
  dismissBtn.type = 'button';
  dismissBtn.textContent = "Got it, don't show again";
  dismissBtn.addEventListener('click', function() {
    if (window.__dismissOnboardingBridge__) window.__dismissOnboardingBridge__();
    closeOverlay();
  });
  body.appendChild(dismissBtn);
}

$historyBtn.addEventListener('click', showHistoryOverlay);
$onboardingBtn.addEventListener('click', showOnboardingOverlay);

/* ── Plan mode: inline Approve / Reject ─ */
function showPlanRow() {
  const row = document.createElement('div');
  row.className = 'plan-row';
  row.innerHTML =
    '<span class="plan-row-label">Plan ready — review the full document, then respond.</span>' +
    '<button class="plan-btn plan-approve" type="button">✓ Approve</button>' +
    '<button class="plan-btn plan-reject" type="button">✗ Reject</button>';
  row.querySelector('.plan-approve').addEventListener('click', function() {
    row.remove();
    $prompt.value = 'The plan looks good — please proceed.';
    doSend();
  });
  row.querySelector('.plan-reject').addEventListener('click', function() {
    row.remove();
    $prompt.value = "I'd like to change this plan before proceeding — here's what I want different: ";
    $prompt.focus();
    autoResize();
  });
  $thread.insertBefore(row, $scrollPill);
  scrollEnd();
}

/* ── Context meter ────────────────────── */
function renderContextMeter(tokensUsed, contextWindow) {
  if (tokensUsed == null || !contextWindow) { $ctxMeter.classList.remove('visible'); return; }
  const pct = Math.min(100, Math.round((tokensUsed / contextWindow) * 100));
  const filledSegs = Math.round((pct / 100) * 5);
  const segs = $ctxTrack.querySelectorAll('.seg');
  segs.forEach(function(s, i) { s.classList.toggle('filled', i < filledSegs); });
  $ctxTrack.classList.toggle('warn', pct >= 75 && pct < 90);
  $ctxTrack.classList.toggle('err', pct >= 90);
  $ctxPct.textContent = pct + '%';
  $ctxMeter.title = tokensUsed.toLocaleString() + ' / ' + contextWindow.toLocaleString() + ' tokens';
  $ctxMeter.classList.add('visible');
}

$ctxMeter.addEventListener('click', function() {
  if (streaming) return;
  $prompt.value = '/compact';
  doSend();
});

/* ── Send / stop ─────────────────────── */
function composeOutgoingText(typed) {
  const prefixes = [];
  if ($ctxPill.classList.contains('visible') && $ctxPill.dataset.ref) prefixes.push($ctxPill.dataset.ref);
  if (currentSelection && !selectionHidden) prefixes.push(currentSelection.ref);
  attachments.forEach(function(a) { prefixes.push('@' + a.path); });
  return prefixes.length ? prefixes.join(' ') + '\n' + typed : typed;
}

function doSend() {
  const typed = $prompt.value.trim();
  if (!typed || streaming) return;
  const outgoing = composeOutgoingText(typed);

  addUserBlock(outgoing);
  turnStartTime = Date.now();
  turnToolCount = 0;
  pinnedToBottom = true;
  hasSentFirstMessage = true;
  $prompt.value = '';
  $prompt.placeholder = 'Continue…';
  autoResize();
  setStreaming(true);
  window.__sendBridge__(outgoing);

  $ctxPill.textContent = ''; delete $ctxPill.dataset.ref; $ctxPill.classList.remove('visible');
  attachments = []; renderAttachments();
}

$sendBtn.addEventListener('click', doSend);

$stopBtn.addEventListener('click', function() {
  if (window.__stopBridge__) window.__stopBridge__();
  finishTurn(null, null);
});

/* ── Prompt keyboard ─────────────────── */
$prompt.addEventListener('keydown', function(e) {
  if (!$popup.classList.contains('hidden')) {
    if (e.key === 'ArrowDown')  { e.preventDefault(); movePopupSel(1);  return; }
    if (e.key === 'ArrowUp')    { e.preventDefault(); movePopupSel(-1); return; }
    if (e.key === 'Escape')     { hidePopup(); return; }
    if (e.key === 'Tab' || (e.key === 'Enter' && !e.shiftKey)) {
      if (acceptActivePopupItem()) { e.preventDefault(); return; }
    }
  }
  const sendCombo = ctrlEnterToSend
    ? (e.key === 'Enter' && (e.ctrlKey || e.metaKey))
    : (e.key === 'Enter' && !e.shiftKey);
  if (sendCombo) { e.preventDefault(); doSend(); }
  if (e.key === 'Escape' && streaming)  { if (window.__stopBridge__) window.__stopBridge__(); finishTurn(null, null); }
});

$prompt.addEventListener('input', function() {
  const at = atContext();
  const slash = slashContext();
  if (at)          { showAtPopup(at[2]); }
  else if (slash)  { showSlashPopup(slash[2].slice(1)); }
  else             { hidePopup(); }
  autoResize();
});

$prompt.addEventListener('blur', function() {
  setTimeout(hidePopup, 150);
});

function autoResize() {
  $prompt.style.height = 'auto';
  $prompt.style.height = Math.min($prompt.scrollHeight, 178) + 'px';
}

/* ── Action bar controls ─────────────── */
$ctxPill.addEventListener('click', function() {
  $ctxPill.textContent = '';
  delete $ctxPill.dataset.ref;
  $ctxPill.classList.remove('visible');
});

$diagBtn.addEventListener('click', function() {
  diagEnabled = !diagEnabled;
  $diagBtn.classList.toggle('active', diagEnabled);
  if (window.__diagBridge__) window.__diagBridge__(diagEnabled ? '1' : '0');
});

$addBtn.addEventListener('click', function() {
  if (window.__addContextBridge__) window.__addContextBridge__();
});

$cmdBtn.addEventListener('click', function() {
  const val = $prompt.value;
  if (!val.endsWith('/') && val !== '') {
    $prompt.value = val + '\n/';
  } else if (val === '') {
    $prompt.value = '/';
  }
  $prompt.dispatchEvent(new Event('input'));
  $prompt.focus();
});

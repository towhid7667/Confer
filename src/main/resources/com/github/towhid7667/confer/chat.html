<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #1c1c1e;
    --border:   #2e2e33;
    --accent:   #CF7A4A;
    --accent-h: #b86a3c;
    --text:     #d0d0d0;
    --text-dim: #55555f;
    --text-mid: #888;
    --code-bg:  #252529;
    --pill-bg:  #2a2a30;
    --tool-bg:  #222227;
    --err-bg:   #3a1c1c;
    --mono: 'JetBrains Mono','Fira Code','Menlo','Consolas',monospace;
    --sans: -apple-system,'Segoe UI',Roboto,'Noto Sans',Ubuntu,sans-serif;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.6;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  /* ── Empty state ──────────────────────────────── */
  #empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 20px;
    user-select: none;
  }

  #empty.hidden { display: none; }

  #empty-logo {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #empty-logo svg { flex-shrink: 0; }

  #empty-hint {
    font-size: 12.5px;
    color: var(--text-mid);
    text-align: center;
    max-width: 280px;
    line-height: 1.7;
  }

  kbd {
    display: inline-block;
    padding: 0 5px;
    background: var(--pill-bg);
    border: 1px solid #3a3a42;
    border-radius: 4px;
    font-size: 11px;
    font-family: var(--mono);
    color: #bbb;
    vertical-align: baseline;
  }

  /* ── Thread ───────────────────────────────────── */
  #thread {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 8px;
    display: none;
  }

  #thread.visible { display: block; }

  #thread::-webkit-scrollbar { width: 3px; }
  #thread::-webkit-scrollbar-track { background: transparent; }
  #thread::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

  .msg-block {
    padding: 12px 16px 10px;
    border-bottom: 1px solid #212124;
  }

  .msg-role {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .msg-role.user   { color: var(--text-dim); }
  .msg-role.claude { color: var(--accent); }

  .stream-dot {
    width: 5px; height: 5px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 1.2s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.1} }

  .msg-content {
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.65;
    font-size: 13px;
  }

  .msg-content code {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--code-bg);
    padding: 1px 5px;
    border-radius: 3px;
  }

  /* ── Tool block ───────────────────────────────── */
  .tool-block {
    margin: 7px 0 3px;
    border: 1px solid #2a2a2f;
    border-radius: 6px;
    overflow: hidden;
    background: var(--tool-bg);
  }

  .tool-hdr {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 10px;
    cursor: pointer;
    color: #888;
    font-size: 12px;
    user-select: none;
  }
  .tool-hdr:hover { background: #282830; }

  .tool-chev {
    font-size: 8px; color: var(--text-dim);
    transition: transform 0.15s; display: inline-block;
  }
  .tool-hdr.open .tool-chev { transform: rotate(90deg); }

  .tool-nm { font-family: var(--mono); font-size: 12px; }

  .tool-bdy {
    display: none;
    padding: 8px 10px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: #90a890;
    white-space: pre-wrap;
    border-top: 1px solid #2a2a2f;
    overflow-x: auto;
    max-height: 200px;
  }
  .tool-hdr.open + .tool-bdy { display: block; }

  .tool-actions {
    display: flex; gap: 6px;
    padding: 6px 10px;
    background: #1e1e22;
    border-top: 1px solid #2a2a2f;
  }

  .tool-btn {
    padding: 3px 10px;
    border-radius: 4px;
    border: 1px solid;
    cursor: pointer;
    font-size: 11.5px;
    font-family: var(--sans);
  }
  .tool-btn:disabled { opacity: 0.35; cursor: default; }
  .t-accept { background:#182a1e; color:#5a9e66; border-color:#264832; }
  .t-reject { background:#2a1818; color:#9e5a5a; border-color:#48262e; }

  /* ── Cost / error ─────────────────────────────── */
  .cost-row {
    text-align: right; font-size: 10px;
    color: var(--text-dim); padding: 2px 16px 4px;
  }

  .err-block {
    margin: 8px 16px;
    padding: 8px 12px;
    background: var(--err-bg);
    border-left: 3px solid #a84848;
    border-radius: 2px;
    font-size: 12px;
    color: #d07070;
  }

  /* ── Input wrap ───────────────────────────────── */
  #input-wrap {
    flex-shrink: 0;
    padding: 8px 12px 10px;
  }

  #input-box {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.15s, box-shadow 0.15s;
    background: #1f1f23;
  }

  #input-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(207,122,74,0.18);
  }

  /* ── Textarea row ─────────────────────────────── */
  #textarea-row {
    display: flex;
    align-items: flex-start;
    padding: 2px 4px 0 4px;
  }

  #prompt {
    flex: 1;
    background: transparent;
    color: var(--text);
    border: none;
    outline: none;
    resize: none;
    padding: 9px 6px 6px 8px;
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.55;
    min-height: 36px;
    max-height: 200px;
    caret-color: var(--accent);
  }

  #prompt::placeholder { color: #484850; }
  #prompt:disabled { opacity: 0.45; }

  #mic-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 9px 8px 6px;
    display: flex;
    align-items: flex-start;
    flex-shrink: 0;
    opacity: 0.5;
  }
  #mic-btn:hover { opacity: 0.9; }

  /* ── Action bar ───────────────────────────────── */
  #action-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6px 6px;
    gap: 4px;
    border-top: 1px solid #252529;
    padding-top: 5px;
  }

  #action-left {
    display: flex;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
  }

  .ab-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    width: 26px;
    height: 22px;
    border-radius: 5px;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s, color 0.1s;
    flex-shrink: 0;
    font-family: var(--sans);
  }
  .ab-btn:hover { background: #2a2a32; color: var(--text); }

  .ab-sep {
    width: 1px;
    height: 14px;
    background: #333;
    margin: 0 2px;
    flex-shrink: 0;
  }

  #ctx-pill {
    display: none;
    align-items: center;
    gap: 4px;
    background: var(--pill-bg);
    border: 1px solid #38383f;
    border-radius: 5px;
    padding: 1px 7px 1px 5px;
    font-size: 11.5px;
    color: #9090a0;
    cursor: pointer;
    white-space: nowrap;
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #ctx-pill.visible { display: flex; }
  #ctx-pill:hover { border-color: #555; color: var(--text); }

  #action-right {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
    margin-left: auto;
  }

  #diag-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 13px;
    padding: 2px 4px;
    border-radius: 4px;
    opacity: 0.5;
    transition: opacity 0.1s, color 0.1s;
  }
  #diag-btn:hover   { opacity: 0.9; }
  #diag-btn.active  { color: var(--accent); opacity: 1; }

  #mode-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 11.5px;
    font-family: var(--sans);
    padding: 2px 6px;
    border-radius: 4px;
    white-space: nowrap;
    transition: color 0.1s, background 0.1s;
  }
  #mode-btn:hover { color: var(--text); background: #2a2a32; }

  #send-btn {
    width: 26px;
    height: 26px;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    transition: background 0.12s;
  }
  #send-btn:hover:not(:disabled) { background: var(--accent-h); }
  #send-btn:disabled { opacity: 0.3; cursor: default; }

  #stop-btn {
    width: 26px;
    height: 26px;
    background: #2a2a32;
    border: 1px solid #444;
    border-radius: 6px;
    color: var(--text);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    flex-shrink: 0;
  }
  #stop-btn:hover { background: #35353f; }
  #stop-btn.visible { display: flex; }
</style>
</head>
<body>

<!-- ── Empty state ──────────────────────────── -->
<div id="empty">
  <div id="empty-logo">
    <!-- Asterisk / snowflake icon matching Claude Code -->
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="11" y1="2" x2="11" y2="20" stroke="#CF7A4A" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="2" y1="11" x2="20" y2="11" stroke="#CF7A4A" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="4.5" y1="4.5" x2="17.5" y2="17.5" stroke="#CF7A4A" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="17.5" y1="4.5" x2="4.5" y2="17.5" stroke="#CF7A4A" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
    Confer
  </div>

  <!-- Pixel art robot mascot -->
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 16" width="72" height="96"
       shape-rendering="crispEdges" style="image-rendering:pixelated">
    <!-- antenna -->
    <rect x="5" y="0" width="2" height="1" fill="#D4814A"/>
    <rect x="4" y="1" width="4" height="1" fill="#D4814A"/>
    <!-- head -->
    <rect x="2" y="2" width="8" height="6" fill="#D4814A"/>
    <!-- left eye dark -->
    <rect x="3" y="3" width="2" height="2" fill="#1c1c1e"/>
    <!-- right eye dark -->
    <rect x="7" y="3" width="2" height="2" fill="#1c1c1e"/>
    <!-- eye shines -->
    <rect x="4" y="3" width="1" height="1" fill="#E8A878"/>
    <rect x="8" y="3" width="1" height="1" fill="#E8A878"/>
    <!-- mouth -->
    <rect x="3" y="6" width="6" height="1" fill="#1c1c1e"/>
    <!-- body -->
    <rect x="3" y="8" width="6" height="5" fill="#D4814A"/>
    <!-- left arm -->
    <rect x="0" y="9" width="3" height="2" fill="#D4814A"/>
    <!-- right arm -->
    <rect x="9" y="9" width="3" height="2" fill="#D4814A"/>
    <!-- left leg -->
    <rect x="3" y="13" width="2" height="2" fill="#D4814A"/>
    <!-- right leg -->
    <rect x="7" y="13" width="2" height="2" fill="#D4814A"/>
    <!-- left foot -->
    <rect x="2" y="14" width="3" height="2" fill="#D4814A"/>
    <!-- right foot -->
    <rect x="7" y="14" width="3" height="2" fill="#D4814A"/>
  </svg>

  <p id="empty-hint">
    Highlight any text and press <kbd>Shift</kbd>+<kbd>Alt</kbd>+<kbd>C</kbd><br>to chat about it
  </p>
</div>

<!-- ── Message thread ──────────────────────── -->
<div id="thread"></div>

<!-- ── Input ───────────────────────────────── -->
<div id="input-wrap">
  <div id="input-box">
    <div id="textarea-row">
      <textarea id="prompt" placeholder="Message Claude…" rows="1"></textarea>
      <button id="mic-btn" tabindex="-1" title="Voice input">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-linecap="round">
          <rect x="4.5" y="0.5" width="5" height="7" rx="2.5" stroke-width="1.2"/>
          <path d="M2 7c0 2.76 2.24 5 5 5s5-2.24 5-5" stroke-width="1.2"/>
          <line x1="7" y1="12" x2="7" y2="14" stroke-width="1.2"/>
          <line x1="5" y1="14" x2="9" y2="14" stroke-width="1.2"/>
        </svg>
      </button>
    </div>

    <div id="action-bar">
      <div id="action-left">
        <button class="ab-btn" id="add-btn" title="Add context — or press Shift+Alt+C in editor">+</button>
        <span class="ab-sep"></span>
        <button class="ab-btn" id="cmd-btn" title="Commands">/</button>
        <span class="ab-sep"></span>
        <div id="ctx-pill" title="Click to clear context"></div>
      </div>
      <div id="action-right">
        <button id="diag-btn" title="Toggle diagnostics">⚡</button>
        <button id="mode-btn">Ask before edits</button>
        <button id="send-btn" title="Send (Enter)">↑</button>
        <button id="stop-btn" title="Stop (Esc)">■</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

const $empty   = document.getElementById('empty');
const $thread  = document.getElementById('thread');
const $prompt  = document.getElementById('prompt');
const $addBtn  = document.getElementById('add-btn');
const $ctxPill = document.getElementById('ctx-pill');
const $diagBtn = document.getElementById('diag-btn');
const $modeBtn = document.getElementById('mode-btn');
const $sendBtn = document.getElementById('send-btn');
const $stopBtn = document.getElementById('stop-btn');

let currentBlock = null;
let streaming    = false;
let diagEnabled  = false;
let currentMode  = 'default';
let ctxRef       = null;

const MODE_CYCLE  = ['default', 'acceptEdits', 'plan'];
const MODE_LABELS = {
  'default':     'Ask before edits',
  'acceptEdits': 'Auto-accept edits',
  'plan':        'Plan mode',
};

/* ── Layout helpers ──────────────────── */

function showThread() {
  $empty.classList.add('hidden');
  $thread.classList.add('visible');
}

function scrollEnd() {
  $thread.scrollTop = $thread.scrollHeight;
}

/* ── Message blocks ──────────────────── */

function addUserBlock(text) {
  showThread();
  const b = document.createElement('div');
  b.className = 'msg-block';
  b.innerHTML = '<div class="msg-role user">You</div><div class="msg-content"></div>';
  b.querySelector('.msg-content').textContent = text;
  $thread.appendChild(b);
  scrollEnd();
}

function startClaudeBlock() {
  currentBlock = document.createElement('div');
  currentBlock.className = 'msg-block';
  currentBlock.innerHTML =
    '<div class="msg-role claude">Claude <span class="stream-dot"></span></div>' +
    '<div class="msg-content"></div>';
  $thread.appendChild(currentBlock);
  scrollEnd();
}

function appendText(text) {
  if (!currentBlock) startClaudeBlock();
  currentBlock.querySelector('.msg-content').textContent += text;
  scrollEnd();
}

function addToolBlock(name, inputJson, toolId, isEdit) {
  let pretty = inputJson;
  try { pretty = JSON.stringify(JSON.parse(inputJson), null, 2); } catch(_) {}

  const block = document.createElement('div');
  block.className = 'tool-block';

  const hdr = document.createElement('div');
  hdr.className = 'tool-hdr';
  hdr.innerHTML =
    '<span class="tool-chev">▶</span>' +
    '<span class="tool-nm">' + String(name).replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</span>';
  hdr.addEventListener('click', function() { hdr.classList.toggle('open'); });

  const bdy = document.createElement('div');
  bdy.className = 'tool-bdy';
  bdy.textContent = pretty;

  block.appendChild(hdr);
  block.appendChild(bdy);

  if (isEdit && toolId) {
    const actions = document.createElement('div');
    actions.className = 'tool-actions';

    const aBtn = document.createElement('button');
    aBtn.textContent = '✓ Accept';
    aBtn.className = 'tool-btn t-accept';

    const rBtn = document.createElement('button');
    rBtn.textContent = '✗ Reject';
    rBtn.className = 'tool-btn t-reject';

    aBtn.onclick = function() {
      window.__acceptBridge__(toolId);
      aBtn.textContent = '✓ Accepted';
      aBtn.disabled = rBtn.disabled = true;
    };
    rBtn.onclick = function() {
      window.__rejectBridge__(toolId);
      rBtn.textContent = '✗ Rejected';
      aBtn.disabled = rBtn.disabled = true;
    };

    actions.appendChild(aBtn);
    actions.appendChild(rBtn);
    block.appendChild(actions);
  }

  if (currentBlock) {
    currentBlock.appendChild(block);
  } else {
    const wrap = document.createElement('div');
    wrap.className = 'msg-block';
    wrap.appendChild(block);
    $thread.appendChild(wrap);
  }
  scrollEnd();
}

function finishTurn(costUsd) {
  if (currentBlock) {
    const dot = currentBlock.querySelector('.stream-dot');
    if (dot) dot.remove();
    currentBlock = null;
  }
  if (costUsd != null) {
    const row = document.createElement('div');
    row.className = 'cost-row';
    row.textContent = '$' + Number(costUsd).toFixed(4);
    $thread.appendChild(row);
  }
  setStreaming(false);
  $prompt.focus();
  scrollEnd();
}

function showError(msg) {
  if (currentBlock) {
    const dot = currentBlock.querySelector('.stream-dot');
    if (dot) dot.remove();
    currentBlock = null;
  }
  showThread();
  const b = document.createElement('div');
  b.className = 'err-block';
  b.textContent = '⚠ ' + msg;
  $thread.appendChild(b);
  setStreaming(false);
  scrollEnd();
}

/* ── Streaming state ─────────────────── */

function setStreaming(on) {
  streaming = on;
  $sendBtn.disabled = $prompt.disabled = on;
  $sendBtn.style.display = on ? 'none' : 'flex';
  $stopBtn.classList.toggle('visible', on);
}

/* ── Bridges called by Kotlin ────────── */

window.injectContext = function(ref) {
  ctxRef = ref;
  const filename = ref.split('/').pop().split('#')[0];
  $ctxPill.textContent = '📄 ' + filename;
  $ctxPill.classList.add('visible');
  $prompt.focus();
};

window.initSettings = function(mode, diag) {
  currentMode = mode;
  $modeBtn.textContent = MODE_LABELS[mode] || mode;
  diagEnabled = !!diag;
  $diagBtn.classList.toggle('active', diagEnabled);
};

window.receiveEvent = function(type, payload) {
  switch (type) {
    case 'text': appendText(payload); break;
    case 'tool': {
      try {
        const d = JSON.parse(payload);
        addToolBlock(d.name, d.input, d.toolId, d.isEdit);
      } catch(_) { addToolBlock('tool', payload, null, false); }
      break;
    }
    case 'end': {
      try { finishTurn(JSON.parse(payload).cost); }
      catch(_) { finishTurn(null); }
      break;
    }
    case 'error': showError(payload); break;
  }
};

/* ── Send / stop ─────────────────────── */

function doSend() {
  const text = $prompt.value.trim();
  if (!text || streaming) return;

  addUserBlock(text);
  startClaudeBlock();
  $prompt.value = '';
  autoResize();
  setStreaming(true);
  window.__sendBridge__(text);
}

$sendBtn.addEventListener('click', doSend);

$stopBtn.addEventListener('click', function() {
  if (window.__stopBridge__) window.__stopBridge__();
  finishTurn(null);
});

$prompt.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
  if (e.key === 'Escape' && streaming)  {
    if (window.__stopBridge__) window.__stopBridge__();
    finishTurn(null);
  }
});

function autoResize() {
  $prompt.style.height = 'auto';
  $prompt.style.height = Math.min($prompt.scrollHeight, 200) + 'px';
}
$prompt.addEventListener('input', autoResize);

/* ── Action bar controls ─────────────── */

$ctxPill.addEventListener('click', function() {
  ctxRef = null;
  $ctxPill.textContent = '';
  $ctxPill.classList.remove('visible');
});

$diagBtn.addEventListener('click', function() {
  diagEnabled = !diagEnabled;
  $diagBtn.classList.toggle('active', diagEnabled);
  if (window.__diagBridge__) window.__diagBridge__(diagEnabled ? '1' : '0');
});

$modeBtn.addEventListener('click', function() {
  const idx  = MODE_CYCLE.indexOf(currentMode);
  currentMode = MODE_CYCLE[(idx + 1) % MODE_CYCLE.length];
  $modeBtn.textContent = MODE_LABELS[currentMode];
  if (window.__modeBridge__) window.__modeBridge__(currentMode);
});

$addBtn.addEventListener('click', function() {
  if (window.__addContextBridge__) window.__addContextBridge__();
});
</script>
</body>
</html>

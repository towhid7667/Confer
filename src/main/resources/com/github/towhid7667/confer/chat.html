<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #1e1f22;
    --surface:     #2b2d30;
    --border:      #43454a;
    --text:        #dfe1e5;
    --muted:       #7a7e85;
    --user-bg:     #2d5a8e;
    --asst-bg:     #2b2d30;
    --tool-bg:     #1a2e1a;
    --tool-border: #2d4a2d;
    --tool-name:   #6ab04c;
    --tool-body:   #a8c6a0;
    --error-col:   #f87171;
    --cost-col:    #6b7280;
    --send-bg:     #2d7dd2;
    --stop-bg:     #3a3d42;
    --radius:      10px;
    --font:        -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono:        'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    line-height: 1.55;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px 12px 6px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 5px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .bubble {
    max-width: 84%;
    padding: 9px 13px;
    border-radius: var(--radius);
    word-wrap: break-word;
    white-space: pre-wrap;
    font-size: 13px;
  }

  .bubble.user {
    align-self: flex-end;
    background: var(--user-bg);
    border-bottom-right-radius: 3px;
  }

  .bubble.assistant {
    align-self: flex-start;
    background: var(--asst-bg);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
  }

  .bubble.assistant.streaming::after {
    content: '\25B4';
    animation: blink 1s step-end infinite;
    margin-left: 2px;
    color: var(--muted);
  }

  @keyframes blink { 50% { opacity: 0; } }

  .tool-block {
    align-self: flex-start;
    width: 98%;
    background: var(--tool-bg);
    border: 1px solid var(--tool-border);
    border-radius: 8px;
    padding: 8px 12px;
  }

  .tool-name {
    font-size: 11px;
    font-weight: 600;
    color: var(--tool-name);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 5px;
  }

  .tool-body {
    font-family: var(--mono);
    font-size: 11.5px;
    white-space: pre-wrap;
    color: var(--tool-body);
    overflow-x: auto;
  }

  .cost-label {
    align-self: flex-end;
    font-size: 10px;
    color: var(--cost-col);
    padding: 1px 4px;
  }

  .error-label {
    align-self: flex-start;
    color: var(--error-col);
    font-size: 12px;
    padding: 4px 6px;
    border-left: 3px solid var(--error-col);
    padding-left: 8px;
  }

  .tool-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }

  .tool-accept, .tool-reject {
    padding: 4px 10px;
    border-radius: 5px;
    border: none;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: opacity 0.12s;
  }

  .tool-accept          { background: #1e3d1e; color: #86c986; border: 1px solid #2d5a2d; }
  .tool-accept:hover    { background: #265026; }
  .tool-reject          { background: #3d1e1e; color: #c98686; border: 1px solid #5a2d2d; }
  .tool-reject:hover    { background: #502626; }
  .tool-accept:disabled,
  .tool-reject:disabled { opacity: 0.4; cursor: default; }

  #input-row {
    display: flex;
    align-items: flex-end;
    gap: 7px;
    padding: 9px 12px 10px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  #prompt {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 11px;
    font-family: var(--font);
    font-size: 13px;
    resize: none;
    min-height: 36px;
    max-height: 120px;
    outline: none;
    line-height: 1.45;
  }

  #prompt:focus { border-color: var(--send-bg); }
  #prompt:disabled { opacity: 0.5; }

  .btn {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: opacity 0.12s;
  }

  #send-btn { background: var(--send-bg); color: #fff; }
  #stop-btn { background: var(--stop-bg); color: var(--text); border: 1px solid var(--border); }
  .btn:hover:not(:disabled) { opacity: 0.82; }
  .btn:disabled { opacity: 0.35; cursor: default; }
</style>
</head>
<body>

<div id="messages"></div>

<div id="input-row">
  <textarea id="prompt"
            placeholder="Ask Claude… (Enter to send, Shift+Enter for newline)"
            rows="1"></textarea>
  <button id="send-btn" class="btn">Send</button>
  <button id="stop-btn" class="btn">Stop</button>
</div>

<script>
'use strict';

const $messages = document.getElementById('messages');
const $prompt   = document.getElementById('prompt');
const $send     = document.getElementById('send-btn');
const $stop     = document.getElementById('stop-btn');

let currentBubble = null;
let streaming     = false;

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function scrollEnd() {
  $messages.scrollTop = $messages.scrollHeight;
}

function addUserBubble(text) {
  const el = document.createElement('div');
  el.className = 'bubble user';
  el.textContent = text;
  $messages.appendChild(el);
  scrollEnd();
}

function startAssistantBubble() {
  currentBubble = document.createElement('div');
  currentBubble.className = 'bubble assistant streaming';
  $messages.appendChild(currentBubble);
  scrollEnd();
}

function appendText(text) {
  if (!currentBubble) startAssistantBubble();
  currentBubble.textContent += text;
  scrollEnd();
}

function addToolBlock(name, inputJson, toolId, isEdit) {
  let pretty = inputJson;
  try { pretty = JSON.stringify(JSON.parse(inputJson), null, 2); } catch (_) {}
  const el = document.createElement('div');
  el.className = 'tool-block';
  el.innerHTML =
    '<div class="tool-name">⚙ ' + escHtml(name) + '</div>' +
    '<div class="tool-body">' + escHtml(pretty) + '</div>';

  if (isEdit && toolId) {
    const actions  = document.createElement('div');
    actions.className = 'tool-actions';

    const acceptBtn = document.createElement('button');
    acceptBtn.textContent = '✓ Accept';
    acceptBtn.className   = 'tool-accept';

    const rejectBtn = document.createElement('button');
    rejectBtn.textContent = '✗ Reject';
    rejectBtn.className   = 'tool-reject';

    acceptBtn.onclick = function () {
      window.__acceptBridge__(toolId);
      acceptBtn.textContent = '✓ Accepted';
      acceptBtn.disabled    = true;
      rejectBtn.disabled    = true;
    };

    rejectBtn.onclick = function () {
      window.__rejectBridge__(toolId);
      rejectBtn.textContent = '✗ Rejected';
      acceptBtn.disabled    = true;
      rejectBtn.disabled    = true;
    };

    actions.appendChild(acceptBtn);
    actions.appendChild(rejectBtn);
    el.appendChild(actions);
  }

  $messages.appendChild(el);
  scrollEnd();
}

function finishTurn(costUsd) {
  if (currentBubble) {
    currentBubble.classList.remove('streaming');
    currentBubble = null;
  }
  if (costUsd != null) {
    const el = document.createElement('div');
    el.className = 'cost-label';
    el.textContent = '$' + Number(costUsd).toFixed(4);
    $messages.appendChild(el);
  }
  streaming       = false;
  $send.disabled  = false;
  $prompt.disabled = false;
  $prompt.focus();
  scrollEnd();
}

function showError(msg) {
  if (currentBubble) { currentBubble.classList.remove('streaming'); currentBubble = null; }
  const el = document.createElement('div');
  el.className = 'error-label';
  el.textContent = '⚠ ' + msg;
  $messages.appendChild(el);
  scrollEnd();
  streaming       = false;
  $send.disabled  = false;
  $prompt.disabled = false;
}

// Pre-fills the textarea with a @file#L reference injected from the IDE action.
window.injectContext = function (ref) {
  const cur = $prompt.value.trimEnd();
  $prompt.value = cur ? cur + '\n' + ref : ref;
  $prompt.dispatchEvent(new Event('input')); // trigger auto-resize
  $prompt.focus();
};

// Called from Kotlin via browser.cefBrowser.executeJavaScript(...)
window.receiveEvent = function (type, payload) {
  switch (type) {
    case 'text':
      appendText(payload);
      break;
    case 'tool':
      try {
        const d = JSON.parse(payload);
        addToolBlock(d.name, d.input, d.toolId, d.isEdit);
      } catch (_) { addToolBlock('tool', payload, null, false); }
      break;
    case 'end':
      try {
        const d = JSON.parse(payload);
        finishTurn(d.cost);
      } catch (_) { finishTurn(null); }
      break;
    case 'error':
      showError(payload);
      break;
  }
};

function doSend() {
  const text = $prompt.value.trim();
  if (!text || streaming) return;
  addUserBubble(text);
  startAssistantBubble();
  $prompt.value    = '';
  $prompt.style.height = 'auto';
  streaming        = true;
  $send.disabled   = true;
  $prompt.disabled = true;
  // __sendBridge__ is injected by Kotlin in onLoadEnd
  window.__sendBridge__(text);
}

$send.addEventListener('click', doSend);

$stop.addEventListener('click', function () {
  if (window.__stopBridge__) window.__stopBridge__();
  finishTurn(null);
});

$prompt.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
});

$prompt.addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
